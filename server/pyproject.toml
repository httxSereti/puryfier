[project]
name = "puryfi-chaster-linker-ws"
version = "0.3.0"
description = "Puryfi Chaster Linker by PluneCorp"
authors = [{ name = "Sereti" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.2",
    "msgpack>=1.1.2",
    "pydantic>=2.12.5",
    "beanie>=2.1.0",
    "uvicorn>=0.42.0",
    "websockets>=16.0",
    "cuid2>=2.0.1",
    "httpx>=0.28.1",
    "structlog>=26.1.0",
    "pydantic-settings>=2.16.2",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
ignore = [
    # FastAPI dependencies are declared as function calls in argument defaults.
    "B008",
]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning:mongomock.*"]

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
