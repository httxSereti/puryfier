# The front container only serves the SPA. The edge (Cloudflare Tunnel or
# Traefik) routes /api and /ws directly to the backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Chaster embeds the extension in an iframe. Do not send
    # X-Frame-Options: DENY/SAMEORIGIN here, or the iframe will be blocked.
    add_header Content-Security-Policy "frame-ancestors 'self' https://chaster.app https://*.chaster.app;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
