# Two ways to expose Puryfier are supported:
#
#   COMPOSE_PROFILES=tunnel   Cloudflare Tunnel (default; no inbound port needed)
#   COMPOSE_PROFILES=traefik  Traefik + Let's Encrypt (self-hosting)
#
# Pick one in .env, then run `docker compose up -d --build`.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: puryfier-cloudflared
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    environment:
      # Remotely-managed tunnel token, see README.
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    # Allows the tunnel to reach dev servers running on the host
    # (host.docker.internal:5173 / :8000). Harmless in production.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy

  traefik:
    image: traefik:v3.6
    container_name: puryfier-traefik
    restart: unless-stopped
    profiles:
      - traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=puryfier_proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirection HTTP -> HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt via DNS challenge Cloudflare
      - --certificatesresolvers.cf.acme.dnschallenge=true
      - --certificatesresolvers.cf.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cf.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cf.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cf.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - proxy

  mongo:
    image: mongo:8
    container_name: puryfier-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-puryfi}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-puryfi}
    ports:
      # Host-only bind so the backend can reach Mongo when run locally (pnpm dev).
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
      args:
        # VITE_BACKEND_URL intentionally stays empty in production: the SPA
        # calls /api and /ws on its own origin.
        VITE_APP_VERSION: ${APP_VERSION:-0.3.0}
    container_name: puryfier-front
    restart: unless-stopped
    labels:
      # Only read by Traefik; harmless when the tunnel profile is used.
      # Lower priority than the server router, which owns /api and /ws.
      - traefik.enable=true
      - traefik.docker.network=puryfier_proxy
      - traefik.http.routers.front.rule=Host(`${PUBLIC_DOMAIN:-${FRONT_DOMAIN:-app.example.com}}`)
      - traefik.http.routers.front.priority=1
      - traefik.http.routers.front.entrypoints=websecure
      - traefik.http.routers.front.tls.certresolver=cf
      - traefik.http.services.front.loadbalancer.server.port=80
    networks:
      - proxy

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: puryfier-server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - CHASTER_DEVELOPER_TOKEN=${CHASTER_DEVELOPER_TOKEN}
      - CHASTER_WEBHOOK_USER=${CHASTER_WEBHOOK_USER}
      - CHASTER_WEBHOOK_PWD=${CHASTER_WEBHOOK_PWD}
      # Always use the Compose service name inside the container; the host
      # DATABASE_URL in .env points to localhost for local development.
      - DATABASE_URL=mongodb://${MONGO_USER:-puryfi}:${MONGO_PASSWORD:-puryfi}@mongo:27017/puryfi_chaster?authSource=admin
      # Same public origin as the frontend.
      - FRONT_URL=https://${PUBLIC_DOMAIN:-${FRONT_DOMAIN:-app.example.com}}
    labels:
      # Forward API and WebSocket traffic directly to the backend, without
      # going through the front/React container.
      - traefik.enable=true
      - traefik.docker.network=puryfier_proxy
      - traefik.http.routers.server.rule=Host(`${PUBLIC_DOMAIN:-${FRONT_DOMAIN:-app.example.com}}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`))
      - traefik.http.routers.server.priority=100
      - traefik.http.routers.server.entrypoints=websecure
      - traefik.http.routers.server.tls.certresolver=cf
      - traefik.http.services.server.loadbalancer.server.port=8000
    networks:
      - proxy
      - internal

volumes:
  mongo_data:
  traefik_letsencrypt:

networks:
  proxy:
    # Explicit name so the Traefik label on the front service keeps working
    # regardless of the Compose project name.
    name: puryfier_proxy
  internal:
    name: puryfier_internal
